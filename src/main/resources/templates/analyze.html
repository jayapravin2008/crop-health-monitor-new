<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Analyze Crop - Crop Health Monitor</title></head>
<body>
<section class="py-5 bg-light min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-white border-0 pt-5 pb-0 text-center">
                        <h2 class="fw-bold text-success">AI Crop Analysis</h2>
                        <p class="text-muted">Upload an image of a crop leaf for instant disease detection.</p>
                        <div class="alert alert-info py-2 px-3 d-inline-block rounded-pill mt-2 fs-7 shadow-sm">
                            <i class="bi bi-info-circle-fill me-1"></i> Demo prediction mode — connect a trained crop disease model for real image-based predictions.
                        </div>
                    </div>
                    <div class="card-body p-5 pt-4">
                        <div th:if="${error}" class="alert alert-danger rounded-3" th:text="${error}"></div>
                        
                        <form th:action="@{/analyze}" method="post" enctype="multipart/form-data" id="analyzeForm">
                            <div class="mb-4">
                                <label class="form-label fw-bold text-dark">Select Crop Type</label>
                                <select name="crop" class="form-select form-select-lg bg-light border-0 shadow-sm" required>
                                    <option value="" disabled selected>Choose a crop...</option>
                                    <option value="Tomato">Tomato</option>
                                    <option value="Potato">Potato</option>
                                    <option value="Corn">Corn</option>
                                    <option value="Apple">Apple</option>
                                    <option value="Grape">Grape</option>
                                    <option value="Pepper">Pepper</option>
                                    <option value="Peach">Peach</option>
                                    <option value="Strawberry">Strawberry</option>
                                    <option value="Soybean">Soybean</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            
                            <div class="mb-5">
                                <label class="form-label fw-bold text-dark">Upload Leaf Image</label>
                                <div class="upload-area border border-2 border-dashed border-success rounded-4 p-5 text-center bg-light position-relative" id="uploadArea">
                                    <input type="file" name="image" id="imageInput" class="position-absolute top-0 start-0 w-100 h-100 opacity-0 cursor-pointer" accept=".jpg,.jpeg,.png" required>
                                    <div id="uploadPlaceholder">
                                        <i class="bi bi-cloud-arrow-up display-1 text-success mb-3"></i>
                                        <h5 class="fw-bold">Drag & Drop Image Here</h5>
                                        <p class="text-muted mb-0">or click to browse (JPG, PNG, max 10MB)</p>
                                    </div>
                                    <div id="imagePreviewContainer" class="d-none">
                                        <img id="imagePreview" src="" alt="Preview" class="img-fluid rounded-3 max-h-300 shadow-sm">
                                        <p class="mt-3 mb-0 fw-bold text-success" id="fileName"></p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="text-center">
                                <button type="submit" class="btn btn-success btn-lg px-5 py-3 rounded-pill fw-bold shadow w-100" id="analyzeBtn">
                                    <i class="bi bi-magic me-2"></i> Analyze Image
                                </button>
                                <div id="loadingSpinner" class="d-none mt-4">
                                    <div class="spinner-border text-success" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2 text-muted fw-bold">Analyzing image with AI...</p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
