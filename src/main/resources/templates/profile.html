<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Profile - Crop Health Monitor</title></head>
<body>
<section class="py-5 bg-light min-vh-100">
    <div class="container">
        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card border-0 shadow-sm rounded-4 text-center">
                    <div class="card-body p-5">
                        <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center mx-auto mb-3 shadow" style="width: 100px; height: 100px; font-size: 40px;">
                            <span th:text="${#strings.substring(user.name,0,1).toUpperCase()}">U</span>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${user.name}">User Name</h4>
                        <p class="text-muted mb-4" th:text="${user.email}">user@example.com</p>
                        
                        <hr class="text-muted">
                        
                        <div class="d-flex justify-content-between text-start mt-4">
                            <span class="text-muted">Member Since</span>
                            <span class="fw-bold" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">01 Jan 2024</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                        <h5 class="fw-bold">Update Profile</h5>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${param.success}" class="alert alert-success rounded-3">Profile updated successfully.</div>
                        <form th:action="@{/profile/update}" method="post">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-bold">Full Name</label>
                                <input type="text" name="name" class="form-control bg-light" th:value="${user.name}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted fw-bold">Email Address</label>
                                <input type="email" class="form-control bg-light text-muted" th:value="${user.email}" disabled>
                                <div class="form-text">Email address cannot be changed.</div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted fw-bold">New Password (leave blank to keep current)</label>
                                <input type="password" name="password" class="form-control bg-light" minlength="6">
                            </div>
                            <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">Save Changes</button>
                        </form>
                    </div>
                </div>
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 bg-primary bg-opacity-10 text-primary">
                            <div class="card-body p-4 text-center">
                                <h3 class="fw-bold mb-1" th:text="${totalAnalyses}">0</h3>
                                <p class="mb-0 fw-bold text-uppercase fs-7">Total Uploads</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 bg-success bg-opacity-10 text-success">
                            <div class="card-body p-4 text-center">
                                <h3 class="fw-bold mb-1" th:text="${healthyCount}">0</h3>
                                <p class="mb-0 fw-bold text-uppercase fs-7">Healthy</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 bg-danger bg-opacity-10 text-danger">
                            <div class="card-body p-4 text-center">
                                <h3 class="fw-bold mb-1" th:text="${diseasedCount}">0</h3>
                                <p class="mb-0 fw-bold text-uppercase fs-7">Diseased</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
