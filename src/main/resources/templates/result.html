<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Analysis Result - Crop Health Monitor</title></head>
<body>
<section class="py-5 bg-light min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-dark">Analysis Result</h2>
                    <div>
                        <a th:href="@{/analyze}" class="btn btn-success rounded-pill px-4 shadow-sm me-2"><i class="bi bi-arrow-repeat me-2"></i>Analyze Another</a>
                        <a th:href="@{/dashboard}" class="btn btn-outline-dark rounded-pill px-4 shadow-sm">Dashboard</a>
                    </div>
                </div>
                
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden mb-4">
                    <div class="row g-0">
                        <div class="col-md-5 bg-dark d-flex align-items-center justify-content-center p-4">
                            <img th:src="@{'/uploads/' + ${analysis.imagePath}}" alt="Crop Image" class="img-fluid rounded-3 shadow" style="max-height: 400px; object-fit: contain;">
                        </div>
                        <div class="col-md-7">
                            <div class="card-body p-5">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div>
                                        <h6 class="text-muted text-uppercase fw-bold mb-1">Crop Type</h6>
                                        <h3 class="fw-bold text-dark mb-0" th:text="${analysis.cropName}">Tomato</h3>
                                    </div>
                                    <span class="badge fs-5 rounded-pill shadow-sm px-4 py-2" 
                                          th:classappend="${analysis.healthStatus == 'Healthy' ? 'bg-success' : 'bg-danger'}" 
                                          th:text="${analysis.healthStatus}">Healthy</span>
                                </div>
                                
                                <hr class="my-4 text-muted">
                                
                                <h6 class="text-muted text-uppercase fw-bold mb-2">Diagnosis</h6>
                                <h4 class="fw-bold text-dark mb-4" th:text="${analysis.diseaseName}">None</h4>
                                
                                <h6 class="text-muted text-uppercase fw-bold mb-2">AI Confidence</h6>
                                <div class="d-flex align-items-center mb-4">
                                    <div class="progress flex-grow-1 h-10px me-3 rounded-pill bg-light border">
                                        <div class="progress-bar rounded-pill" 
                                             th:classappend="${analysis.confidence > 90 ? 'bg-success' : (analysis.confidence > 70 ? 'bg-warning' : 'bg-danger')}"
                                             role="progressbar" 
                                             th:style="'width: ' + ${analysis.confidence} + '%'" 
                                             th:aria-valuenow="${analysis.confidence}" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                    <span class="fw-bold fs-5" th:text="${analysis.confidence} + '%'">95%</span>
                                </div>
                                
                                <p class="text-muted small mb-0"><i class="bi bi-calendar-event me-1"></i> Analyzed on <span th:text="${#temporals.format(analysis.analyzedAt, 'dd MMM yyyy, HH:mm')}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row g-4" th:if="${analysis.healthStatus == 'Diseased'}">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 h-100 bg-white">
                            <div class="card-body p-4">
                                <div class="d-flex align-items-center mb-3 text-warning">
                                    <i class="bi bi-search fs-3 me-2"></i>
                                    <h5 class="fw-bold mb-0">Symptoms</h5>
                                </div>
                                <p class="text-muted" th:text="${analysis.symptoms}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 h-100 bg-white">
                            <div class="card-body p-4">
                                <div class="d-flex align-items-center mb-3 text-primary">
                                    <i class="bi bi-bandaid fs-3 me-2"></i>
                                    <h5 class="fw-bold mb-0">Treatment</h5>
                                </div>
                                <p class="text-muted" th:text="${analysis.treatment}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4 h-100 bg-white">
                            <div class="card-body p-4">
                                <div class="d-flex align-items-center mb-3 text-success">
                                    <i class="bi bi-shield-check fs-3 me-2"></i>
                                    <h5 class="fw-bold mb-0">Prevention</h5>
                                </div>
                                <p class="text-muted" th:text="${analysis.prevention}"></p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row g-4" th:if="${analysis.healthStatus == 'Healthy'}">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm rounded-4 bg-success bg-opacity-10">
                            <div class="card-body p-4 text-center">
                                <i class="bi bi-tree-fill display-4 text-success mb-3"></i>
                                <h4 class="fw-bold text-success">Great news! Your crop appears healthy.</h4>
                                <p class="text-muted mx-auto" style="max-width: 600px;" th:text="${analysis.treatment}">Continue regular maintenance and watering.</p>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</section>
</body>
</html>
