<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Dashboard - Crop Health Monitor</title></head>
<body>
<section class="py-5 bg-light min-vh-100">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">Welcome, <span class="text-success" th:text="${session.userName}"></span>!</h2>
            <div>
                <a th:href="@{/analyze}" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm"><i class="bi bi-plus-lg me-2"></i>Analyze New Crop</a>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 text-center">
                        <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex p-3 mb-3">
                            <i class="bi bi-clipboard-data fs-3"></i>
                        </div>
                        <h6 class="text-muted fw-bold text-uppercase">Total Analyses</h6>
                        <h2 class="fw-bold mb-0" th:text="${totalAnalyses}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 text-center">
                        <div class="rounded-circle bg-success bg-opacity-10 text-success d-inline-flex p-3 mb-3">
                            <i class="bi bi-check-circle fs-3"></i>
                        </div>
                        <h6 class="text-muted fw-bold text-uppercase">Healthy Crops</h6>
                        <h2 class="fw-bold mb-0 text-success" th:text="${healthyCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 text-center">
                        <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex p-3 mb-3">
                            <i class="bi bi-exclamation-triangle fs-3"></i>
                        </div>
                        <h6 class="text-muted fw-bold text-uppercase">Diseased Crops</h6>
                        <h2 class="fw-bold mb-0 text-danger" th:text="${diseasedCount}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-white border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 text-center">
                        <div class="rounded-circle bg-info bg-opacity-10 text-info d-inline-flex p-3 mb-3">
                            <i class="bi bi-percent fs-3"></i>
                        </div>
                        <h6 class="text-muted fw-bold text-uppercase">Avg Confidence</h6>
                        <h2 class="fw-bold mb-0 text-info" th:text="${avgConfidence} + '%'">0%</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Charts -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-header bg-white border-0 pt-4 pb-0">
                        <h5 class="fw-bold">Health Status Distribution</h5>
                    </div>
                    <div class="card-body d-flex justify-content-center align-items-center">
                        <canvas id="healthChart" style="max-height: 300px;"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- Recent Activity -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-header bg-white border-0 pt-4 pb-2 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0">Recent Analyses</h5>
                        <a th:href="@{/history}" class="btn btn-sm btn-outline-success rounded-pill">View All</a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th class="ps-4">Crop</th>
                                        <th>Status</th>
                                        <th>Disease</th>
                                        <th class="pe-4 text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="analysis : ${recentAnalyses}">
                                        <td class="ps-4 fw-bold" th:text="${analysis.cropName}">Tomato</td>
                                        <td>
                                            <span class="badge rounded-pill" 
                                                  th:classappend="${analysis.healthStatus == 'Healthy' ? 'bg-success' : 'bg-danger'}" 
                                                  th:text="${analysis.healthStatus}">Healthy</span>
                                        </td>
                                        <td th:text="${analysis.diseaseName}">None</td>
                                        <td class="pe-4 text-end">
                                            <a th:href="@{'/analysis/' + ${analysis.id}}" class="btn btn-sm btn-light rounded-circle"><i class="bi bi-arrow-right"></i></a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(recentAnalyses)}">
                                        <td colspan="4" class="text-center py-4 text-muted">No analyses found. Start by analyzing a new crop.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            var healthy = /*[[${healthyCount}]]*/ 0;
            var diseased = /*[[${diseasedCount}]]*/ 0;
            
            if(healthy > 0 || diseased > 0) {
                var ctx = document.getElementById('healthChart').getContext('2d');
                var healthChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Healthy', 'Diseased'],
                        datasets: [{
                            data: [healthy, diseased],
                            backgroundColor: ['#198754', '#dc3545'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        },
                        cutout: '70%'
                    }
                });
            } else {
                document.getElementById('healthChart').parentElement.innerHTML = '<p class="text-muted my-5">No data available for chart.</p>';
            }
        });
    </script>
</section>
</body>
</html>
