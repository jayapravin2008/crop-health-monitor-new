<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Crop Health Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-tree-fill me-2"></i>Crop Health Monitor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                    <th:block th:if="${session.userId == null}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li>
                        <li class="nav-item"><a class="btn btn-light text-success fw-bold ms-2 rounded-pill px-3" th:href="@{/register}">Register</a></li>
                    </th:block>
                    <th:block th:if="${session.userId != null}">
                        <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/analyze}">Analyze</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/history}">History</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/profile}"><i class="bi bi-person-circle"></i> <span th:text="${session.userName}"></span></a></li>
                        <li class="nav-item"><a class="btn btn-outline-light ms-2 rounded-pill px-3" th:href="@{/logout}">Logout</a></li>
                    </th:block>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <div th:replace="${content}"></div>
    </main>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 Crop Health Monitor - AI-Based Crop Health Monitoring and Disease Detection System.</p>
            <small class="text-muted">B.Tech Artificial Intelligence and Data Science Project</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
